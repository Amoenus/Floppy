repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        args: ["-r", "requirements.txt"]
        files: ^requirements(-dev)?\.txt$
  - repo: local
    hooks:
      - id: check-migrations
        name: check-migrations
        entry: uv run python src/manage.py makemigrations --check
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: django-upgrade
        name: django-upgrade
        entry: uv run django-upgrade
        language: system
        types: [python]
      - id: pyflakes
        name: pyflakes
        entry: python -m pyflakes
        language: system
        types: [python]
        require_serial: true
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: djlint-lint
        name: djlint-lint
        entry: uv run djlint --lint
        language: system
        types: [html]
        require_serial: true
      - id: djlint-reformat
        name: djlint-reformat
        entry: uv run djlint --reformat
        language: system
        types: [html]
        require_serial: true
