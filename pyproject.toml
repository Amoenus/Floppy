[tool.ruff]
target-version = "py312"
line-length = 88          # enforced by `ruff format`, not by E501 (see ignore list)
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "PT", "PD", "D100", "D104", "RUF012", "PLR0913", "SLF001",
    "COM812", "TD002", "TD003", "TD004",
    # `ruff format` is the line-length authority (see .pre-commit-config.yaml).
    # E501 only fires on what the formatter cannot split: string literals,
    # comments and docstring prose. W505 (via max-doc-length) is the same
    # concession for documentation, which the formatter does not reflow.
    "E501",
    # --- Remaining backlog, suppressed deliberately. Each entry is a policy
    # --- decision, not an oversight; see the PR description for the numbers.
    # Deferred imports. Many exist to break circular-import cycles between the
    # statistics/cache/task modules; hoisting them risks breaking app startup.
    "PLC0415",
    # Legacy complexity. Hundreds of functions exceed the default thresholds,
    # the worst by a wide margin. Refactoring them is a project in its own
    # right and no current test guards those paths.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    # Broad excepts at provider and network boundaries. Narrowing each one needs
    # knowledge of what a given provider client can raise; several handlers
    # classify the error by inspecting it rather than by type.
    "BLE001",
    # Unused arguments on framework contract signatures: Django management
    # command handle(), webhook processor overrides, signal receivers. The names
    # are fixed by the caller, so renaming them would break the contract.
    "ARG001",
    "ARG002",
    "ARG005",
    # Boolean positional arguments. Making these keyword-only is an API change
    # across call sites in templates and tasks, not a lint fix.
    "FBT001",
    "FBT002",
    "FBT003",
    # null=True on text fields. Fixing means a schema migration, a data
    # migration and auditing every __isnull filter that depends on it.
    "DJ001",
    # TODO markers are deliberate here; TD002/3/4 are already ignored above.
    "FIX002",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test code is not held to application lint standards. This list is
# deliberately explicit rather than "ALL": rules that do not currently fire
# in tests stay enforced, notably F811 (a duplicate test method silently
# shadows an earlier one, so a test that appears to run does not) and F821.
"**/tests/**" = [
    # Docstrings: 950+ docstrings on self-describing test methods/classes
    # add no information.
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D205",    # missing-blank-line-after-summary
    "D210",    # surrounding-whitespace
    "D401",    # non-imperative-mood

    # Fixture credentials and data: password="12345" in create_user, and
    # pickle/XML parsing of local, trusted mock payloads.
    "S105",    # hardcoded-password-string
    "S106",    # hardcoded-password-func-arg
    "S301",    # suspicious-pickle-usage
    "S314",    # suspicious-xml-element-tree-usage

    # Naive datetimes: constructing fixed fixture timestamps.
    "DTZ001",  # call-datetime-without-tzinfo
    "DTZ007",  # call-datetime-strptime-without-zone

    # Line length: long mock payloads and URL literals.
    "E501",    # line-too-long
    "W505",    # doc-line-too-long

    # Test-harness idioms: unused hook args, print() in benchmarks, deferred
    # imports, SomeModel = apps.get_model(...) locals, patch-target imports.
    "ARG001",  # unused-function-argument
    "ARG002",  # unused-method-argument
    "ARG005",  # unused-lambda-argument
    "T201",    # print
    "PLC0415", # import-outside-top-level
    "N803",    # invalid-argument-name
    "N806",    # non-lowercase-variable-in-function
    "F401",    # unused-import (patch targets, fixture side effects)
    "F841",    # unused-variable
    "A001",    # builtin-variable-shadowing
    "A004",    # builtin-import-shadowing

    # Style in test helpers: asserting against literals is correct in
    # tests; exception-message and micro-optimisation rules carry no
    # weight in a test helper.
    "EM101",   # raw-string-in-exception
    "EM102",   # f-string-in-exception
    "TRY002",  # raise-vanilla-class
    "TRY003",  # raise-vanilla-args
    "FBT003",  # boolean-positional-value-in-call
    "PLR2004", # magic-value-comparison
    "B905",    # zip-without-explicit-strict
    "B017",    # assert-raises-exception
    "C901",    # complex-structure
    "RET504",  # unnecessary-assign
    "PERF401", # manual-list-comprehension
    "SIM117",  # multiple-with-statements
    "RUF003",  # ambiguous-unicode-character-comment
    "RUF005",  # collection-literal-concatenation
    "RUF059",  # unused-unpacked-variable
    "FLY002",  # static-join-to-f-string
]

[tool.djlint]
custom_blocks = "element,slot,setvar"
preserve_blank_lines = true
ignore = "H006,H021"
indent = 2

[tool.coverage.run]
concurrency = ["multiprocessing"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py", "*/admin.py"]
