name: App Tests

on:
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - latest
      - release
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-workflow-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for workflow modifications
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
      - name: Fail if workflows were modified
        if: steps.changes.outputs.workflows == 'true'
        run: |
          echo "::error::Workflow files were modified in this PR."
          exit 1

  test:
    needs: check-workflow-changes
    if: always()
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check workflow verification result
        if: |
          github.event_name == 'pull_request_target' && 
          needs.check-workflow-changes.result == 'failure'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install

      - name: Ruff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "Not a pull request - running full check."
            ruff check src
            exit $?
          fi
          python - <<'PY'
          import json, os, re, subprocess, sys

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]

          # Lines added/modified by this PR, per file.
          diff = subprocess.run(
              ["git", "diff", "--unified=0", f"{base}...{head}", "--", "src"],
              capture_output=True, text=True, check=True,
          ).stdout

          changed: dict[str, set[int]] = {}
          path = None
          hunk = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@")
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  path = line[6:]
              elif line.startswith("@@") and path:
                  m = hunk.match(line)
                  if m:
                      start = int(m.group(1))
                      count = int(m.group(2) or 1)
                      changed.setdefault(path, set()).update(
                          range(start, start + count)
                      )

          changed = {p: lines for p, lines in changed.items() if p.endswith(".py")}

          if not changed:
              print("No changed Python lines under src/ - nothing to lint.")
              sys.exit(0)

          proc = subprocess.run(
              ["ruff", "check", "src", "--output-format=json", "--no-cache"],
              capture_output=True, text=True,
          )
          if proc.returncode not in (0, 1):
              sys.stderr.write(proc.stderr)
              sys.exit(proc.returncode)
          diagnostics = json.loads(proc.stdout or "[]")

          repo = os.getcwd()
          offending = []
          for d in diagnostics:
              rel = os.path.relpath(d["filename"], repo)
              row = (d.get("location") or {}).get("row")
              if row is not None and row in changed.get(rel, ()):
                  offending.append((rel, row, d["code"], d["message"]))

          total = len(diagnostics)
          print(f"{total} violations exist in src/; gating on changed lines only.")

          if offending:
              print(f"\n{len(offending)} violation(s) on lines this PR changed:\n")
              for rel, row, code, msg in sorted(offending):
                  print(f"  {rel}:{row}: {code} {msg}")
              sys.exit(1)

          print("No violations on changed lines.")
          PY

      - name: Set environment variables from secrets
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> $GITHUB_ENV; fi
          # Pull requests from forks cannot read repository secrets, so this
          # expands to empty for them and Django then refuses to start. SECRET is
          # the only variable settings.py treats as mandatory, so fall back to an
          # ephemeral one: nothing signed during a test run outlives the job.
          if [ -z "${{ secrets.SECRET }}" ]; then
            echo "SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> $GITHUB_ENV
          fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> $GITHUB_ENV; fi

      - name: Run Tests
        run: |
          # Tests tagged "network" call live provider APIs. They are slow and
          # flaky, and a pull request from a fork cannot read repository secrets,
          # so they fail there regardless of the change. Run them deliberately
          # with scripts/test.sh --network.
          coverage run src/manage.py test app users integrations lists events \
            --parallel --exclude-tag network

      - name: Build Coverage Report
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
