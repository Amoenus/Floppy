services:
  floppy:
    # The harness always sets this before `up`; a default lets `exec` and
    # `down` re-read this file during cleanup without requiring interpolation.
    image: ${FLOPPY_BENCHMARK_IMAGE:-floppy:memory-benchmark}
    mem_limit: ${FLOPPY_BENCHMARK_MEMORY_LIMIT:-1000000000}
    memswap_limit: ${FLOPPY_BENCHMARK_MEMORY_LIMIT:-1000000000}
    # The sampler reads /proc/<pid>/smaps_rollup for every supervised process.
    # This diagnostic-only capability is not part of the application runtime.
    cap_add:
      - SYS_PTRACE
    environment:
      SECRET: memory-benchmark-only-secret
      REDIS_URL: redis://redis:6379
      DEBUG: "False"
      DEMO_ACCOUNT_ENABLED: "False"
      REGISTRATION: "False"
      # The harness sets these from --topology. Keep defaults so ad-hoc compose
      # inspection remains possible without its environment.
      FLOPPY_RESOURCE_TIER: ${FLOPPY_BENCHMARK_RESOURCE_TIER:-standard}
      WEB_CONCURRENCY: ${FLOPPY_BENCHMARK_WEB_CONCURRENCY:-1}
      GUNICORN_THREADS: ${FLOPPY_BENCHMARK_GUNICORN_THREADS:-4}
      CELERY_WORKER_CONCURRENCY: ${FLOPPY_BENCHMARK_CELERY_CONCURRENCY:-1}
      FLOPPY_CELERY_QUEUES: ${FLOPPY_BENCHMARK_CELERY_QUEUES:-celery,discover}
      FLOPPY_CELERY_ROLE: ${FLOPPY_BENCHMARK_CELERY_ROLE:-background}
      FLOPPY_START_INTERACTIVE_WORKER: ${FLOPPY_BENCHMARK_START_INTERACTIVE_WORKER:-true}
      FLOPPY_START_DISCOVER_WORKER: ${FLOPPY_BENCHMARK_START_DISCOVER_WORKER:-false}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - benchmark_db:/floppy/db

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly no --save "" --maxmemory 256mb --maxmemory-policy volatile-lru

volumes:
  benchmark_db:
