  /api/v1/playback/progress/:
    get:
      operationId: api_v1_playback_progress_retrieve
      description: List saved resume positions, newest first. Supports ?updated_since=
        for delta sync, ?media_type= (comma separated) and ?completed=true|false,
        plus the standard limit/offset.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        media_type:
                          type: string
                          enum:
                          - movie
                          - episode
                          - podcast
                        source:
                          type: string
                          nullable: true
                        media_id:
                          type: string
                          nullable: true
                        season_number:
                          type: integer
                          nullable: true
                        episode_number:
                          type: integer
                          nullable: true
                        ids:
                          type: object
                        title:
                          type: string
                          nullable: true
                        series_title:
                          type: string
                          nullable: true
                        position_seconds:
                          type: integer
                          nullable: true
                        duration_seconds:
                          type: integer
                          nullable: true
                        completed:
                          type: boolean
                        updated_at:
                          type: string
                          format: date-time
                          nullable: true
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
    put:
      operationId: api_v1_playback_progress_update
      description: 'Set an absolute resume position. Sending "position_seconds": null
        clears it, for clients that cannot send a DELETE body. Movies/episodes create
        the metadata item if it isn''t known yet, without creating a watch record;
        podcasts require an already-tracked episode.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - media_type
              - ids
              properties:
                media_type:
                  type: string
                  enum:
                  - movie
                  - episode
                  - podcast
                ids:
                  type: object
                  description: 'Movies/episodes: at least one of tmdb/imdb/tvdb. Podcasts:
                    episode_uuid (Pocket Casts UUID or RSS GUID).'
                  properties:
                    tmdb:
                      type: string
                      nullable: true
                    imdb:
                      type: string
                      nullable: true
                    tvdb:
                      type: string
                      nullable: true
                    episode_uuid:
                      type: string
                      nullable: true
                season_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                episode_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                position_seconds:
                  type: integer
                  nullable: true
                  description: Absolute resume position. null clears it.
                duration_seconds:
                  type: integer
                  nullable: true
                completed:
                  type: boolean
                  nullable: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_type:
                    type: string
                    enum:
                    - movie
                    - episode
                    - podcast
                  source:
                    type: string
                    nullable: true
                  media_id:
                    type: string
                    nullable: true
                  season_number:
                    type: integer
                    nullable: true
                  episode_number:
                    type: integer
                    nullable: true
                  ids:
                    type: object
                  title:
                    type: string
                    nullable: true
                  series_title:
                    type: string
                    nullable: true
                  position_seconds:
                    type: integer
                    nullable: true
                  duration_seconds:
                    type: integer
                    nullable: true
                  completed:
                    type: boolean
                  updated_at:
                    type: string
                    format: date-time
                    nullable: true
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
    delete:
      operationId: api_v1_playback_progress_destroy
      description: Clear a saved resume position.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
