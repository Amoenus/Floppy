components:
  schemas:
    Consumption:
      type: object
      properties:
        consumption_id:
          type: integer
        status:
          type: integer
          nullable: true
        progress:
          type: number
          nullable: true
    Episode:
      allOf:
      - $ref: '#/components/schemas/Item'
      - type: object
        properties:
          season_number:
            type: integer
          episode_number:
            type: integer
    Item:
      type: object
      properties:
        media_id:
          type: string
        source:
          type: string
        media_type:
          type: string
        title:
          type: string
        consumptions:
          type: array
          items:
            $ref: '#/components/schemas/Consumption'
    Media:
      type: object
      description: Serializer used for media items.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          x-enumNames:
          - Planning
          - In progress
          - Paused
          - Completed
          - Dropped
          description: |-
            Responses always return the integer code. Requests (POST/PATCH) may alternatively send the status label as a case-insensitive string (e.g. "completed", "In Progress") instead of the integer code.

            Integer mapping: 0 = Planning, 1 = In progress, 2 = Paused, 3 = Completed, 4 = Dropped
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        progress:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        progressed_at:
          type: string
          format: date-time
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        item:
          type: integer
        import_run:
          type: integer
          nullable: true
          description: The import run that created or last touched this row, if any.
      required:
      - created_at
      - id
      - item
      - status
    PatchedMedia:
      type: object
      description: Serializer used for media items.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          x-enumNames:
          - Planning
          - In progress
          - Paused
          - Completed
          - Dropped
          description: |-
            Responses always return the integer code. Requests (POST/PATCH) may alternatively send the status label as a case-insensitive string (e.g. "completed", "In Progress") instead of the integer code.

            Integer mapping: 0 = Planning, 1 = In progress, 2 = Paused, 3 = Completed, 4 = Dropped
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          nullable: true
        progress:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        progressed_at:
          type: string
          format: date-time
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        item:
          type: integer
        import_run:
          type: integer
          nullable: true
          description: The import run that created or last touched this row, if any.
    Season:
      allOf:
      - $ref: '#/components/schemas/Item'
      - type: object
        properties:
          season_number:
            type: integer
    StatusEnum:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
