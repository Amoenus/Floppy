openapi: 3.0.3
info:
  title: Floppy
  version: 1.0.0
  description: A self-hosted media tracker.
  contact:
    url: https://github.com/dannyvfilms/Floppy/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/calendar/:
    get:
      operationId: api_v1_calendar_retrieve
      description: Retrieve calendar events for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/calendar/update/:
    post:
      operationId: api_v1_calendar_update_create
      description: Trigger calendar events update for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/changes_history/{media_type}/{history_id}/:
    get:
      operationId: api_v1_changes_history_retrieve
      description: Retrieve the changes history record for a specific media.
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_changes_history_destroy
      description: Delete the changes history record for a specific media.
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/collection/:
    get:
      operationId: api_v1_collection_retrieve
      description: List the user's collection entries.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_collection_create
      description: Add an item to the collection (mirrors collection_add).
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/collection/{entry_id}/:
    get:
      operationId: api_v1_collection_retrieve_2
      description: Return a single collection entry.
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_v1_collection_partial_update
      description: Update collection entry metadata (mirrors collection_update).
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_collection_destroy
      description: Remove an entry from the collection (mirrors collection_remove).
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/collection/seasons/{season_item_id}/:
    delete:
      operationId: api_v1_collection_seasons_destroy
      description: Delete the season's collected episode entries (mirrors web view).
      parameters:
      - in: path
        name: season_item_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/collection/status/{item_id}/:
    get:
      operationId: api_v1_collection_status_retrieve
      description: Return has_collection_data for the item.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/discover/:
    get:
      operationId: api_v1_discover_retrieve
      description: Return the cached Discover rows for the media type.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/discover/hidden/:
    get:
      operationId: api_v1_discover_hidden_retrieve
      description: Return the user's hidden Discover entries.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_discover_hidden_create
      description: Hide or unhide an item (mirrors discover_toggle_hidden).
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/discover/refresh/:
    post:
      operationId: api_v1_discover_refresh_create
      description: Queue a background rebuild for the media type's Discover tab.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/export/csv/:
    get:
      operationId: api_v1_export_csv_retrieve
      description: |-
        Stream the CSV backup.

        Query params: media_types (repeatable) to restrict types,
        include_lists=0 to skip custom lists, include_collection=0 to skip
        collection entries, only=collection for a collection-only export.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/export/template/:
    get:
      operationId: api_v1_export_template_retrieve
      description: Return the template CSV content.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      description: Check API health status.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/history/:
    get:
      operationId: api_v1_history_retrieve
      description: Return the user's history grouped by day, newest first.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/history/{media_type}/{history_id}/:
    delete:
      operationId: api_v1_history_destroy
      description: Delete the record; play-per-instance types delete the play itself.
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - game
          - manga
          - movie
          - music
          - podcast
          - tv
        description: Media type. Does not include `season`/`episode` — those are addressed
          via separate path segments under `tv`.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/home/:
    get:
      operationId: api_v1_home_retrieve
      description: Return home groups with serialized row items.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/imports/{service}/:
    post:
      operationId: api_v1_imports_create
      description: Dispatch the import task for the service.
      parameters:
      - in: path
        name: service
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/imports/activity/:
    get:
      operationId: api_v1_imports_activity_retrieve
      description: Return the user's recent import task results and schedules.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/info/:
    get:
      operationId: api_v1_info_retrieve
      description: Get application information.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/lists/:
    get:
      operationId: api_v1_lists_retrieve
      description: Retrieve the lists for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_lists_create
      description: Create a new custom list for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/:
    get:
      operationId: api_v1_lists_retrieve_2
      description: Retrieve details and paginated items of a specific list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_v1_lists_partial_update
      description: Update a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_lists_destroy
      description: Delete a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/lists/{list_id}/activity/:
    get:
      operationId: api_v1_lists_activity_retrieve
      description: Return the 100 most recent activity entries.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/collaborators/:
    get:
      operationId: api_v1_lists_collaborators_retrieve
      description: Return collaborator usernames.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: api_v1_lists_collaborators_update
      description: Replace the collaborator set with the given usernames.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/items/:
    get:
      operationId: api_v1_lists_items_retrieve
      description: Get items of a list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/items/{item_id}/:
    get:
      operationId: api_v1_lists_items_retrieve_2
      description: Get details of a list item.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_lists_items_destroy
      description: Delete an item from a list.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/lists/{list_id}/items/order/:
    put:
      operationId: api_v1_lists_items_order_update
      description: Apply the full order (mirrors reorder_list_items_all).
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/items/reorder/:
    post:
      operationId: api_v1_lists_items_reorder_create
      description: Apply a first/back/next/last move (mirrors reorder_list_item).
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/recommendations/:
    get:
      operationId: api_v1_lists_recommendations_retrieve
      description: Return pending recommendations (owner/collaborators only).
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v1_lists_recommendations_create
      description: Submit a recommendation (mirrors submit_recommendation, auth only).
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/recommendations/{recommendation_id}/{decision}/:
    post:
      operationId: api_v1_lists_recommendations_create_2
      description: Apply the decision; approval adds the item to the list.
      parameters:
      - in: path
        name: decision
        schema:
          type: string
          pattern: ^approve|deny$
        required: true
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: recommendation_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/smart-rules/:
    get:
      operationId: api_v1_lists_smart_rules_retrieve
      description: Return the list's smart configuration.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: api_v1_lists_smart_rules_update
      description: Replace the smart rules and re-sync membership.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/lists/{list_id}/smart-sync/:
    post:
      operationId: api_v1_lists_smart_sync_create
      description: Run sync_smart_items and return the resulting count.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/media/:
    get:
      operationId: api_v1_media_retrieve
      description: Retrieve the list of media for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
  /api/v1/media/{media_type}/:
    get:
      operationId: api_v1_media_retrieve_2
      description: Retrieve the list of media of a specific media type.
      parameters:
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
    post:
      operationId: trackMedia
      description: |-
        Create a new consumption for a media item.

        This append-oriented endpoint keeps its historical default: omitted
        status means Planning. Clients updating an existing play should first
        read its consumption_id and use the exact history route instead.
      parameters:
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Media'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Media'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Media'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumption'
          description: ''
  /api/v1/media/{media_type}/{source}/{media_id}/:
    get:
      operationId: retrieveMediaItem
      description: Retrieve details of a specific media for the authenticated user.
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
