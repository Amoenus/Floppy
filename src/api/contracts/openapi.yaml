  /api/v1/scrobble/:
    post:
      operationId: api_v1_scrobble_create
      description: Record a playback start/pause/stop event from a third-party client.
        Movies are identified by tmdb/imdb id; episodes additionally require season_number/episode_number.
        'start'/'pause' only update the live Now Playing card; 'stop' persists a durable
        watch/progress update.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - media_type
              - ids
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - pause
                  - stop
                media_type:
                  type: string
                  enum:
                  - movie
                  - episode
                ids:
                  type: object
                  description: At least one of tmdb/imdb/tvdb is required.
                  properties:
                    tmdb:
                      type: string
                      nullable: true
                    imdb:
                      type: string
                      nullable: true
                    tvdb:
                      type: string
                      nullable: true
                title:
                  type: string
                  nullable: true
                series_title:
                  type: string
                  nullable: true
                  description: Required (in effect) for media_type 'episode' to power
                    live-card display and title search fallback.
                season_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                episode_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                position_seconds:
                  type: integer
                  nullable: true
                duration_seconds:
                  type: integer
                  nullable: true
                completed:
                  type: boolean
                  nullable: true
                  description: Only used by 'stop'. Overrides the position/duration
                    completion heuristic when given.
                played_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Only used by 'stop'. Defaults to now.
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  errors:
                    type: string
          description: ''
  /api/v1/search/{media_type}/:
    get:
      operationId: searchMedia
      description: Search for media using the specified provider.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Maximum number of results to return (default: 20).'
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      - in: query
        name: offset
        schema:
          type: integer
        description: 'Offset for pagination (default: 0).'
      - in: query
        name: search
        schema:
          type: string
        description: Search query passed to the provider.
      - in: query
        name: source
        schema:
          type: string
        description: Provider to search (e.g. `tmdb`, `igdb`). Defaults to the media
          type's default provider when omitted.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        format: uri
                        nullable: true
                      previous:
                        type: string
                        format: uri
                        nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
          description: ''
